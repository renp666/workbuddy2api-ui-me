services:
  mock:
    image: ${WB2A_ACCEPTANCE_CORE_IMAGE:?set WB2A_ACCEPTANCE_CORE_IMAGE}
    platform: linux/amd64
    user: "10001:10001"
    pull_policy: never
    entrypoint: ["python3", "/mock/mock_upstream.py"]
    restart: "no"
    volumes:
      - ${WB2A_ACCEPTANCE_MOCK:?set WB2A_ACCEPTANCE_MOCK}:/mock/mock_upstream.py:ro
    networks: [mock]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/livez"]
      interval: 1s
      timeout: 1s
      retries: 20

  core:
    image: ${WB2A_ACCEPTANCE_CORE_IMAGE:?set WB2A_ACCEPTANCE_CORE_IMAGE}
    environment:
      WB2A_ADMIN_KEY: ${WB2A_ADMIN_KEY:-}
      WB2A_API_KEY: ${WB2A_API_KEY:-}
    pull_policy: never
    restart: "no"
    networks: [mock]
    volumes:
      - auths:/app/auths
      - data:/app/data
      - keys:/run/wb2a
      - type: bind
        source: ${WB2A_CONFIG_FILE:?set test config path}
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: false
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7863/livez"]
      interval: 1s
      timeout: 1s
      retries: 30
    depends_on:
      mock:
        condition: service_healthy

  console:
    image: ${WB2A_ACCEPTANCE_CONSOLE_IMAGE:?set WB2A_ACCEPTANCE_CONSOLE_IMAGE}
    pull_policy: never
    restart: "no"
    networks: [mock, entry]
    environment:
      WB2A_PUBLIC_ORIGIN: ${WB2A_PUBLIC_ORIGIN:?set test origin}
      WB2A_ADMIN_KEY: ${WB2A_ADMIN_KEY:-}
      WB2A_API_KEY: ${WB2A_API_KEY:-}
    ports: !override
      - "127.0.0.1:${WB2A_PORT:?set test port}:7863"
    # Compose 的 volumes 按 target 合并，普通列表只能追加、无法删掉运行版基类里
    # 宿主相对的 ./runtime/wb2api/console（可写）挂载——那会让隔离验收直接读写真实
    # 部署的路由配置，且 /run/wb2a 之外的挂载使 acceptance.sh 的挂载判据永远不可能通过。
    volumes: !override
      - keys:/run/wb2a:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      disable: false
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7863/livez"]
      interval: 1s
      timeout: 1s
      retries: 30

networks:
  mock:
    internal: true
  entry: {}

volumes:
  auths:
    name: ${WB2A_AUTHS_VOLUME:?set test auths volume}
    external: true
  data:
    name: ${WB2A_DATA_VOLUME:?set test data volume}
    external: true
  keys:
    name: ${WB2A_KEYS_VOLUME:?set test keys volume}
    external: true
