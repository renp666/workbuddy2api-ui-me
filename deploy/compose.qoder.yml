# Optional Qoder CN sidecar: docker compose -f docker-compose.yml -f deploy/compose.qoder.yml up -d
# Auth (either one works):
#   1. Page login (recommended): open the Qoder tab in the console and click 开始登录.
#      The in-container control process drives qoderclicn device-flow OAuth; no PAT needed.
#   2. Unattended/PAT: set WB2A_QODER_PAT (from https://qoder.com.cn/account/integrations).
# The container joins console's network namespace (network_mode: service:console): proxy and
# login-control APIs listen on 127.0.0.1 only, never on the Compose network or the host.
services:
  qoder-proxy:
    build:
      context: .
      dockerfile: deploy/qoder.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    network_mode: service:console
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      CONTROL_PORT: "3001"
      CLI_BACKEND: "cn"
      # 数据面密钥（console -> qoder-proxy:3000）
      PROXY_API_KEY: ${WB2A_QODER_KEY:-}
      # 控制面密钥（console -> qoder-login-ctl:3001）；为空时退化为环路+自定义头防护
      CONTROL_API_KEY: ${WB2A_QODER_KEY:-}
      # 无人值守备选：页面登录与本地凭据存在时无需配置
      QODERCN_PERSONAL_ACCESS_TOKEN: ${WB2A_QODER_PAT:-}
      # qoderclicn 默认解析 ~/.qoder-cn，而凭据卷挂载在 /root/.qoderworkcn；不钉死这一项时
      # 登录写入与 CLI 读取分属两个目录，表现为渠道周期性 "Not logged in" 掉线。
      QODERCN_CONFIG_DIR: "/root/.qoderworkcn"
    volumes:
      - ./runtime/qoder:/root/.qoderworkcn

  console:
    environment:
      WB2A_QODER_URL: http://127.0.0.1:3000
      WB2A_QODER_KEY: ${WB2A_QODER_KEY:-}
      WB2A_QODER_CONTROL_URL: http://127.0.0.1:3001
    depends_on:
      core:
        condition: service_started
