# 可选并列旁路通道：小浣熊（商汤，raccoon- 前缀）。
# 默认不启用；宿主用 `docker compose -f docker-compose.yml -f deploy/compose.raccoon.yml up -d` 接入。
# 生产入口 docker-compose.yml 不引入本文件，因此不设开关变量时公共出口逐字节不变。
services:
  raccoon-proxy:
    build:
      context: .
      dockerfile: deploy/raccoon.Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    # 借 console 的网络命名空间：数据面只监听回环，宿主访问不到 7867。
    network_mode: service:console
    environment:
      TZ: Asia/Shanghai
      # console 注入的桥接密钥；为空时 sidecar 不鉴权（仅本机调试）。
      WB2A_RACCOON_KEY: ${WB2A_RACCOON_KEY:-}
    volumes:
      # 账号凭据与状态：小浣熊没有网页登录，登录态由控制台页签粘贴导入。
      - ./runtime/raccoon:/data

  console:
    environment:
      # 设置后才分流：公共 /v1/chat/completions、/v1/messages、/v1/responses 按 model 的
      # raccoon- 前缀转发到 sidecar，/v1/models 合并其目录；/admin/* 管理链路不走这里。
      WB2A_RACCOON_URL: http://127.0.0.1:7867
      WB2A_RACCOON_KEY: ${WB2A_RACCOON_KEY:-}
    depends_on:
      core:
        condition: service_started